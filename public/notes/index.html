<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Notes</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1f1b2e;--mute:#6b6480;--line:#e4e0ee;--acc:#6d5bd0;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131d;--card:#1f1c2a;--ink:#ece9f5;--mute:#a39cb8;--line:#302c3f;--acc:#a899f0;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#15131d;--card:#1f1c2a;--ink:#ece9f5;--mute:#a39cb8;--line:#302c3f;--acc:#a899f0;--warn:#ff8a80}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;width:100%;max-width:360px}
h1{font-size:16px;margin:0 0 12px;font-weight:600}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
button{margin-top:10px;width:100%;font:inherit;padding:10px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
label.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-top:10px}
.err{color:var(--warn);font-size:13px;min-height:1.4em;margin-top:8px}
</style>
</head>
<body>
<form id="f">
 <h1>Notes</h1>
 <input id="p" type="password" autocomplete="current-password" placeholder="密碼" autofocus>
 <label class="rem"><input id="r" type="checkbox"> 這台裝置記住解鎖</label>
 <button type="submit">解鎖</button>
 <div class="err" id="e"></div>
</form>
